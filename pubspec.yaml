name: stronghold_flutter_sdk
description: >
  Native Flutter/Dart SDK for the SHx token ecosystem on Stellar. SHx
  asset operations, governance voting, and escrow contract bindings.
version: 0.0.3-dev
homepage: https://github.com/nemorixgroup/stronghold-flutter-sdk
repository: https://github.com/nemorixgroup/stronghold-flutter-sdk
issue_tracker: https://github.com/nemorixgroup/stronghold-flutter-sdk/issues

topics:
  - blockchain
  - stellar
  - shx
  - stronghold
  - soroban

platforms:
  android:
  ios:
  web:

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  stellar_flutter_sdk: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
